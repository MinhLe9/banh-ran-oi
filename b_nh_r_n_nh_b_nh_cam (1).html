<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bánh Rán & Bánh Cam ♡</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#ff8fa3',
                            lightpink: '#ffb3c1',
                            soft: '#fff0f3',
                            accent: '#ff4d6d',
                            deep: '#c9184a',
                            cream: '#fff9fb'
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        cute: ['Quicksand', 'sans-serif'],
                        hand: ['Pacifico', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c1 100%);
            touch-action: manipulation;
            user-select: none;
            overflow-x: hidden;
        }

        /* Pulse heart glow */
        @keyframes heartPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 77, 109, 0.4)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 12px rgba(255, 77, 109, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 77, 109, 0.4)); }
        }

        .animate-heart-pulse {
            animation: heartPulse 1.5s infinite ease-in-out;
        }

        /* Floating background elements */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            animation: floatUp 8s linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Envelope CSS Styling */
        .envelope {
            width: 280px;
            height: 180px;
            background-color: #ffb3c1;
            position: relative;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 35px rgba(201, 24, 74, 0.2);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            border-left: 140px solid #ff8fa3;
            border-top: 90px solid transparent;
            border-bottom: 90px solid #ff8fa3;
            border-bottom-left-radius: 12px;
        }

        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            z-index: 2;
            border-right: 140px solid #ff758f;
            border-top: 90px solid transparent;
            border-bottom: 90px solid #ff758f;
            border-bottom-right-radius: 12px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #ff4d6d;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s, z-index 0.2s 0.4s;
            z-index: 3;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .heart-seal {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .envelope.open .heart-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.1);
        }

        .kitten-box {
            background: radial-gradient(circle, #fff 60%, #ffe5ec 100%);
            border: 3px dashed #ff8fa3;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative overflow-hidden">

    <div id="bg-hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Modal Popup Letter (HIỆN RA SAU KHÍ BẮN TRÚNG) -->
    <div id="letter-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-500">

                        <path d="M50 78 C50 78 30 62 30 50 C30 42 38 38 44 43 C50 48 50 48 50 48 C50 48 50 48 56 43 C62 38 70 42 70 50 C70 62 50 78 50 78 Z" fill="#FF4D6D" stroke="#FFF" stroke-width="2"/>

    <!-- Footer -->
    <footer class="text-center text-xs text-brand-deep/60 font-semibold z-10 py-2">
        Được làm với tất cả tình yêu ♡

    <script>
        // Sound System
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playShoot() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }

            playHit() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);

                    gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.3);
                });
            }

            playCelebration() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.4);
                });
            }
        }

        const soundFX = new SoundFX();
        const audioBtn = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');

        audioBtn.addEventListener('click', () => {
            soundFX.init();
            soundFX.muted = !soundFX.muted;
            if (!soundFX.muted) {
                audioIcon.className = 'fa-solid fa-volume-high text-brand-accent';
                soundFX.playHit();
            } else {
                audioIcon.className = 'fa-solid fa-volume-xmark text-brand-deep';
            }
        });

        // Floating hearts background
        function createBackgroundHearts() {
            const container = document.getElementById('bg-hearts-container');
            const heartIcons = ['fa-heart', 'fa-heart-pulse'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('i');
                const randomIcon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.className = `fa-solid ${randomIcon} bg-heart`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${6 + Math.random() * 6}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${12 + Math.random() * 20}px`;
                container.appendChild(heart);
            }
        }

        // Canvas Shooting Game Logic
        const canvas = document.getElementById('archeryCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        
        let bowPos = { x: 0, y: 0 };
        let targetPos = { x: 0, y: 0, radius: 28 };
        let arrow = null;
        let targetHit = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            width = canvas.width;
            height = canvas.height;
            bowPos = { x: width / 2, y: height - 45 };
            targetPos = { x: width / 2, y: 55, radius: 26 };
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Arrow {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.active = true;
                this.angle = Math.atan2(vy, vx);
            }

            update() {
                if (!this.active) return;
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.12; // Gravity effect
                this.angle = Math.atan2(this.vy, this.vx);

                // Collision Detection with Target Heart
                const distToTarget = Math.hypot(this.x - targetPos.x, this.y - targetPos.y);
                if (distToTarget < targetPos.radius + 10 && !targetHit) {
                    this.active = false;
                    targetHit = true;
                    triggerTargetHit();
                }

                // Boundary check
                if (this.x < -20 || this.x > width + 20 || this.y > height + 20 || this.y < -20) {
                    this.active = false;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Shaft
                ctx.beginPath();
                ctx.moveTo(-25, 0);
                ctx.lineTo(10, 0);
                ctx.strokeStyle = '#c9184a';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Heart Arrowhead
                ctx.fillStyle = '#ff4d6d';
                ctx.beginPath();
                ctx.arc(10, -3, 4, 0, Math.PI * 2);
                ctx.arc(10, 3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(10, -6);
                ctx.lineTo(20, 0);
                ctx.lineTo(10, 6);
                ctx.fill();

                ctx.restore();
            }
        }

        function drawTarget() {
            ctx.save();
            ctx.translate(targetPos.x, targetPos.y);

            // Pulsing target heart
            const scale = 1 + Math.sin(Date.now() / 300) * 0.08;
            ctx.scale(scale, scale);

            // Outer Target Circle
            ctx.beginPath();
            ctx.arc(0, 0, targetPos.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(255, 77, 109, 0.4)';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.strokeStyle = '#ff8fa3';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Inner Target Heart
            ctx.fillStyle = '#ff4d6d';
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.bezierCurveTo(-15, -5, -20, -18, 0, -22);
            ctx.bezierCurveTo(20, -18, 15, -5, 0, 10);
            ctx.fill();

            ctx.restore();
        }

        function drawBow() {
            ctx.save();
            ctx.translate(bowPos.x, bowPos.y);

            let pullAngle = 0;
            let pullDist = 0;

            if (isDragging) {
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                pullAngle = Math.atan2(dy, dx);
                pullDist = Math.min(Math.hypot(dx, dy), 80);
            }

            // Bow Arch
            ctx.strokeStyle = '#ff4d6d';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(0, 0, 35, Math.PI * 0.8, Math.PI * 2.2, false);
            ctx.stroke();

            // Bow String
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const leftEnd = { x: 35 * Math.cos(Math.PI * 0.8), y: 35 * Math.sin(Math.PI * 0.8) };
            const rightEnd = { x: 35 * Math.cos(Math.PI * 2.2), y: 35 * Math.sin(Math.PI * 2.2) };

            if (isDragging) {
                const pullX = -Math.cos(pullAngle) * pullDist;
                const pullY = -Math.sin(pullAngle) * pullDist;

                ctx.moveTo(leftEnd.x, leftEnd.y);
                ctx.lineTo(pullX, pullY);
                ctx.lineTo(rightEnd.x, rightEnd.y);
                ctx.stroke();

                // Aim Guideline
                ctx.save();
                ctx.setLineDash([4, 6]);
                ctx.strokeStyle = 'rgba(255, 77, 109, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(pullX, pullY);
                ctx.lineTo(-pullX * 3, -pullY * 3);
                ctx.stroke();
                ctx.restore();

                // Arrow Ready
                const tempArrow = new Arrow(pullX, pullY, 0, 0);
                tempArrow.angle = Math.atan2(-pullY, -pullX);
                tempArrow.draw();
            } else {
                ctx.moveTo(leftEnd.x, leftEnd.y);
                ctx.lineTo(rightEnd.x, rightEnd.y);
                ctx.stroke();
            }

            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawTarget();
            drawBow();

            if (arrow && arrow.active) {
                arrow.update();
                arrow.draw();
            }

            requestAnimationFrame(gameLoop);
        }

        // Pointer / Touch Handlers
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleStart(e) {
            soundFX.init();
            const pos = getCanvasCoords(e);
            isDragging = true;
            dragStart = pos;
            dragCurrent = pos;
        }

        function handleMove(e) {
            if (!isDragging) return;
            dragCurrent = getCanvasCoords(e);
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;

            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 15) {
                const power = Math.min(dist, 80) * 0.22;
                const angle = Math.atan2(dy, dx);
                
                const vx = Math.cos(angle) * power;
                const vy = Math.sin(angle) * power;

                arrow = new Arrow(bowPos.x, bowPos.y - 10, vx, vy);
                soundFX.playShoot();
            }
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: true });
        window.addEventListener('touchmove', handleMove, { passive: true });
        window.addEventListener('touchend', handleEnd);

        function triggerTargetHit() {
            soundFX.playHit();

            // Confetti burst on hit
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.4 },
                colors: ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffb3c1']
            });

            // Show Letter Modal after arrow hits
            setTimeout(() => {
                const modal = document.getElementById('letter-modal');
                const card = document.getElementById('letter-card');
                const envelope = document.getElementById('envelope');

                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
                
                card.classList.remove('scale-90');
                card.classList.add('scale-100');

                // Animate Envelope Opening
                setTimeout(() => {
                    envelope.classList.add('open');
                }, 400);
            }, 500);
        }

        // Runaway "No" button logic
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const actionButtons = document.getElementById('action-buttons');
        const questionText = document.getElementById('question-text');
        const successMessage = document.getElementById('success-message');
        const modalContent = document.getElementById('modal-content');
        let escapeCount = 0;

        function moveNoButton() {
            escapeCount++;
            
            if (escapeCount >= 5) {
                // Change "No" button to "Yes" button if dodged 5 times
                btnNo.innerHTML = '<i class="fa-solid fa-heart"></i> Có chứ ♡';
                btnNo.className = btnYes.className;
                btnNo.onclick = handleYesClick;
                return;
            }

            const parentRect = actionButtons.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            const maxX = parentRect.width - btnRect.width;
            const maxY = 60;

            const randomX = Math.floor(Math.random() * (maxX - 20));
            const randomY = Math.floor((Math.random() - 0.5) * maxY);

            btnNo.style.position = 'absolute';
            btnNo.style.left = `${Math.max(10, randomX)}px`;
            btnNo.style.top = `${randomY}px`;
        }

        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function handleYesClick() {
            soundFX.playCelebration();

            // Firework confetti
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ff4d6d', '#ff758f', '#ffffff']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff4d6d', '#ff8fa3', '#ffd166']
                }));
            }, 250);

            // Hide question & buttons, show success view
            modalContent.classList.add('hidden');
            successMessage.classList.remove('hidden');
            successMessage.classList.add('flex');
        }

        btnYes.addEventListener('click', handleYesClick);

        // Replay Button Logic
        document.getElementById('btn-replay').addEventListener('click', () => {
            const modal = document.getElementById('letter-modal');
            const card = document.getElementById('letter-card');
            const envelope = document.getElementById('envelope');

            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            envelope.classList.remove('open');

            // Reset Game & Modal States
            setTimeout(() => {
                targetHit = false;
                arrow = null;

                successMessage.classList.add('hidden');
                successMessage.classList.remove('flex');
                modalContent.classList.remove('hidden');

                btnNo.style.position = 'relative';
                btnNo.style.left = 'auto';
                btnNo.style.top = 'auto';
                btnNo.innerHTML = 'Không nhớ 😜';
                btnNo.className = "bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold px-6 py-3 rounded-full shadow transition-all text-sm font-cute border border-gray-200 z-10";
                escapeCount = 0;
            }, 500);
        });

        window.onload = () => {
            createBackgroundHearts();
            gameLoop();
        };
    </script>
</body>
</html>
